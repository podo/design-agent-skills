note: "verified 2026-10-21; a bare `npx skills add deanpeters/Product-Manager-Skills` installs the whole PM library (dozens of skills), so the install is narrowed to these nine. Plugin names checked against .claude-plugin/marketplace.json only, not run (upstream warns to pick the all-skills bundle product-manager-skills OR individual plugins, not both)"
