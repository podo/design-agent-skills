type: package
tier: experimental
category: diagrams
rank: 2
upstream: https://github.com/softaworks/agent-toolkit
version: latest
install_default: npx skills add softaworks/agent-toolkit --skill mermaid-diagrams excalidraw draw-io c4-architecture marp-slide database-schema-designer design-system-starter
installed_as:
  - mermaid-diagrams
  - excalidraw
  - draw-io
  - c4-architecture
