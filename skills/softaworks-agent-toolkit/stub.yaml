  - /plugin install marp-slide@agent-toolkit
  - /plugin install database-schema-designer@agent-toolkit
  - /plugin install design-system-starter@agent-toolkit
license: MIT
note: "verified 2026-10-21; narrowed from a bare repo install (the whole toolkit is dozens of mostly non-design skills such as jira, codex, gemini, commit-work, datadog-cli, humanizer). The excalidraw skill here is a context-saving delegation guide for reading .excalidraw JSON and writes the same directory as the excalidraw-agents365 stub (different upstream, different skill). Plugin names checked against .claude-plugin/marketplace.json only, not run. Last push 2026-03-05."
