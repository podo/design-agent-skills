type: package
tier: community
category: visual-components
rank: 3
upstream: https://github.com/bergside/awesome-design-skills
version: latest
install_default: npx skills add bergside/awesome-design-skills --skill glassmorphism brutalism claymorphism neumorphism editorial bento
installed_as:
  - glassmorphism
  - brutalism
  - claymorphism
  - neumorphism
