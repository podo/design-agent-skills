type: package
tier: official
category: official-suites
rank: 2
upstream: https://github.com/expo/skills
version: latest
install_default: npx skills add expo/skills --skill expo-overview expo-project-structure expo-router expo-animation expo-native-ui expo-design-system expo-ui expo-data-fetching expo-dom expo-web-to-native expo-module expo-brownfield expo-dev-client expo-examples expo-app-clip expo-upgrade expo-skill-feedback eas-app-stores eas-hosting eas-workflows eas-observe eas-update eas-update-insights eas-simulator expo-migrate-module
installed_as:
  - expo-overview
  - expo-project-structure
  - expo-router
  - expo-animation
  - expo-native-ui
  - expo-design-system
  - expo-ui
  - expo-data-fetching
  - expo-dom
  - expo-web-to-native
  - expo-module
  - expo-brownfield
  - expo-dev-client
  - expo-examples
  - expo-app-clip
  - expo-upgrade
  - expo-skill-feedback
  - eas-app-stores
  - eas-hosting
  - eas-workflows
  - eas-observe
  - eas-update
  - eas-update-insights
  - eas-simulator
