license: MIT
note: "verified 2026-10-21. Upstream reorganised into plugins/expo/skills/* (old names like building-native-ui, native-data-fetching, upgrading-expo, use-dom, expo-tailwind-setup, expo-api-routes, expo-cicd-workflows, expo-deployment no longer exist). The bare repo install also lands expo-skill-eval (maintainer eval harness), deliberately left out here. Plugin route taken from upstream README, not run"
