license: MIT
note: "verified 2026-10-21; package is a single set of Agent Skills: six router skills dispatch the rest by name (Activate the skill \"<name>\"), so a partial --skill install would leave routers calling missing skills; the bare repo install is deliberate and installed_as lists everything it lands"
