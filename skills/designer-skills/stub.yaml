license: MIT
note: "verified 2026-10-21; the bare install is deliberate: it is the whole design-practice collection of this repo (same set as the nine local plugins) and the skills reference each other. Pick a subset by passing names to --skill, or install single skills through their own stubs. The marketplace also lists four sibling collections (AI product design, UX program management, design leadership, inclusive design) that live in other repos and are NOT installed here. The old route (`/plugin marketplace add` alone) only registered the marketplace and installed nothing. Plugin names checked against marketplace.json, not run. Installs directories that other stubs with DIFFERENT upstreams also write: design-brief, ux-writing, data-visualization, interview-script, summarize-interview, jobs-to-be-done (see the batch report); many other directories are written by single-skill stubs of this same upstream, which is harmless"
