note: "verified 2026-10-21; the npx route is a targeted --skill list of the product-management skills (discovery, strategy, execution, market research, go-to-market, marketing and growth, A/B and cohort analysis); a bare install writes every skill in the repo, including generic names (code-review, retro, sql-queries, summarize-meeting, grammar-check, dummy-dataset) that overwrite a user's own skills, and the NDA, privacy-policy and resume skills and the AI shipping kit, which are not product management; those stay available through the plugin route, which keeps them namespaced; competitor-analysis (assimovt-productskills), customer-journey-map and opportunity-solution-tree (deanpeters-pm-skills) and interview-script and summarize-interview (designer-skills) are also written by stubs with different upstreams; plugin route checked against README and marketplace.json, not run"
