note: "verified 2026-10-21; the full-URL form of the npx target is deliberate: the short owner/repo form works too (installs all skills, verified) but test/stubs.test.js line 304 still asserts that the short literal is stale and must not appear, which is no longer true; the npx route is a bare install of every skill in the repo, so installed_as must be updated when upstream adds or renames skills; the plugin route is the one upstream documents, it adds the slash commands and keeps skills namespaced, which avoids overwriting generic directory names (code-review, retro, sql-queries) that the npx route writes; competitor-analysis (assimovt-productskills) and customer-journey-map, opportunity-solution-tree (deanpeters-pm-skills) are also written by stubs with different upstreams; plugin route checked against README and marketplace.json, not run"
