type: package
tier: community
category: product-pm
rank: 2
upstream: https://github.com/aoshimash/skills
upstream_path: plugins/aoshimash-skills/skills/create-issue/SKILL.md
version: latest
install_default: npx skills add aoshimash/skills --skill create-issue
installed_as: create-issue
install_claude:
  - /plugin marketplace add aoshimash/skills
