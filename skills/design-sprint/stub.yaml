license: MIT
note: "verified 2026-10-21; repointed: upstream merged the old design-sprint skill into create-issue (commit d3a83422, 2026-07-05), so this stub now installs create-issue and the Design Flow is the former design-sprint; this stub no longer writes a design-sprint directory, which removes the old collision with wondelai-skills; plugin route (documented in upstream README) installs the whole aoshimash-skills collection, not run"
conflicts_with:
  - wondelai-skills
