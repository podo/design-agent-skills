type: package
tier: community
category: design-review
rank: 3
upstream: https://github.com/wondelai/skills
version: latest
install_default: npx skills add wondelai/skills --skill refactoring-ui design-everyday-things microinteractions lean-ux design-sprint inspired-product jobs-to-be-done hooked-ux
installed_as:
  - refactoring-ui
  - design-everyday-things
  - microinteractions
  - lean-ux
  - design-sprint
  - inspired-product
  - jobs-to-be-done
  - hooked-ux
install_claude:
  - /plugin marketplace add wondelai/skills
  - /plugin install ux-design@wondelai-skills
  - /plugin install product-innovation@wondelai-skills
  - /plugin install product-strategy@wondelai-skills
license: MIT
note: "verified 2026-10-21; the repo holds many more skills (business, marketing, code) that a bare install would add, so --skill is used for the design and product-design subset; the design-sprint skill (Knapp's 5-day sprint) writes the directory design-sprint, which is also the directory name of the catalogue stub design-sprint (now a pointer to aoshimash create-issue), so installing both pointers into the same skills directory overwrites one with the other; the plugin route collections (ux-design, product-innovation, product-strategy) also bring other skills from the same books, read from the upstream README only, not run"
conflicts_with:
  - design-sprint
  - designer-skills
