type: package
tier: community
category: product-pm
rank: 2
upstream: https://github.com/product-on-purpose/pm-skills
version: latest
install_default: npx skills add product-on-purpose/pm-skills --skill define-problem-statement define-hypothesis define-jtbd-canvas define-opportunity-tree discover-interview-synthesis discover-journey-map discover-competitive-analysis foundation-persona develop-design-rationale develop-solution-brief deliver-prd deliver-user-stories deliver-acceptance-criteria deliver-edge-cases measure-experiment-design measure-survey-analysis
installed_as:
  - define-problem-statement
  - define-hypothesis
  - define-jtbd-canvas
  - define-opportunity-tree
  - discover-interview-synthesis
  - discover-journey-map
  - discover-competitive-analysis
  - foundation-persona
  - develop-design-rationale
  - develop-solution-brief
  - deliver-prd
  - deliver-user-stories
  - deliver-acceptance-criteria
  - deliver-edge-cases
  - measure-experiment-design
  - measure-survey-analysis
install_claude:
