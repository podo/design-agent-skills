  - /plugin install pm-skills@product-on-purpose
license: Apache-2.0
note: "verified 2026-10-21; upstream recommends the plugin (all skills, sub-agents and slash commands). The default npx install is a core subset by discovery/define/develop/deliver/measure phase; the whole library is `npx skills add product-on-purpose/pm-skills` with no --skill. Plugin route checked against marketplace.json only, not run; the older pm-skills-marketplace (plugin pm-skills) still works."
