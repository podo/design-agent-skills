type: package
tier: community
category: design-review
rank: 1
upstream: https://github.com/garrytan/gstack
upstream_path: plan-design-review/SKILL.md
version: latest
install_mode: manual
manual_reason: This skill is part of gstack and calls gstack's shared tooling (`~/.claude/skills/gstack/bin/…`), so install gstack itself rather than the single skill (`--skill plan-design-review` fails because the CLI only sees gstack's root router; the subpath form `npx skills add garrytan/gstack/plan-design-review` installs the instructions without the tooling). `./setup` needs Bun, builds binaries, downloads Chromium and registers a Stop hook in your Claude settings (opt out with `./setup --no-timeline-stop-hook`); ask the user before running it. Upstream's README also tells agents to add a gstack section to CLAUDE.md after setup.
install_steps:
  - git clone --single-branch --depth 1 https://github.com/garrytan/gstack.git ~/.claude/skills/gstack
  - cd ~/.claude/skills/gstack && ./setup
install_check: ~/.claude/skills/gstack/plan-design-review/SKILL.md
installed_as: plan-design-review
requires:
  - Bun (setup refuses versions older than 1.3.3; upstream tests 1.4.2+), Git and Claude Code
  - "Optional: the gstack design binary plus an OpenAI API key for mockups; Codex CLI for outside design voices"
license: MIT
size_mb: 98
note: "verified 2026-10-21; the shallow clone is about 98 MB on disk (GitHub reports 185 MB for the full history), ./setup deliberately not run. garrytan/gstack shares this clone with design-consultation, design-review-garrytan and design-html (same upstream, same ~/.claude/skills/gstack dir)"
