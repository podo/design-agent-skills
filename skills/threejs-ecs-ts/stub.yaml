note: "verified 2026-10-21; upstream has no SKILL.md files, only topic markdown under skills/<area>/<topic>.md, each with name/description frontmatter, plus a non-standard claude-code-plugin.json. Its README route (git clone + ln -s into ~/.claude/plugins) registers nothing in Claude Code. The skills CLI accepts a raw URL to such a file and installs it as a skill named by its frontmatter, so each topic is one command; this stub installs the ECS, TypeScript, scene-setup and R3F-ECS core and the repo holds many more topics (three.js, mobile, react, game-systems) that can be added the same way. Upstream status doc says all of them are complete; README lists far fewer"
