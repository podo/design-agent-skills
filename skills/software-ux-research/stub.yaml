manual_reason: The original repository (vasilyu1983/AI-Agents-public) is no longer on GitHub (404), so this skill comes from gabrielmoreira/agent-skills-mirror, an automated mirror of agent-skill repositories. That repo is about 1.4 GB, so only this one skill directory is sparse-checked out (about 75 MB of git metadata, roughly 12 s) and installed from the local path; the clone can be deleted afterwards.
install_steps:
