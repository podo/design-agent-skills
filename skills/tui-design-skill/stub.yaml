note: "verified 2026-10-21; the skill is called tui-design (not tui-design-skill) and installs next to this pointer. The old /plugin marketplace add on its own installed nothing. install_claude is deliberately left out only because scripts/lib/lint.mjs wrongly rejects `/plugin install tui-design@tui-design-marketplace` (its check skips any install command containing the word marketplace); the real two-step route, checked against .claude-plugin/marketplace.json and the README but not run, is `/plugin marketplace add gfargo/tui-design-skill` then `/plugin install tui-design@tui-design-marketplace`: restore it as install_claude once the lint is fixed. The author also ships the skill in the central gfargo/skills marketplace (terminal@gfargo-skills, bundled with vhs-cli-demos); that bundle replaces, not complements, this route"
