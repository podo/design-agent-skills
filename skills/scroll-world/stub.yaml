note: "verified 2026-10-27; the skill is small (about 50 KB) because the cost is in generation, not code: it interviews for topic, story beats and brand kit, generates N scene stills plus N dive-in and N-1 connector clips, then drops a framework-free scroll-scrub engine (references/scrub-engine.js) into any page. Seams must be frame-identical or the page pops between scenes. Do not offer this skill to someone without a funded Higgsfield/Monid account"
