type: skill
tier: experimental
category: diagrams
rank: 2
upstream: https://github.com/agilek/wireframer-skill
upstream_path: SKILL.md
version: latest
install_default: npx skills add agilek/wireframer-skill --skill wireframer
installed_as: wireframer
install_claude:
  - /plugin marketplace add agilek/wireframer-skill
