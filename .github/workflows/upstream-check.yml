name: Upstream URL check

on:
  schedule:
    - cron: '0 9 * * 1'   # weekly, Monday 09:00 UTC
  workflow_dispatch:        # manual trigger

jobs:
  check-upstreams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Report rank-1 gaps (warning only)
        run: |
          node scripts/rank-audit.mjs | grep "← no rank-1" && echo "" && echo "Note: categories with no rank-1 skill listed above" || echo "OK — every category has a rank-1 skill"

      - name: Check every upstream is alive and not stale
        env:
          GH_TOKEN: ${{ github.token }}   # authenticated → 5000 req/hr (avoids 60/hr rate-limit false-negatives)
        run: node scripts/check-upstreams.mjs --paths
