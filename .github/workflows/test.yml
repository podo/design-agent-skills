name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need history to diff changed skills against the base branch

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run test suite
        run: npm test

      - name: Validate README skills table
        run: node scripts/generate-readme-table.mjs --check

      - name: Validate README skill + profile counts
        run: |
          node --input-type=module << 'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          const SKILLS_DIR = path.resolve('.', 'skills');
          const dirs = fs.readdirSync(SKILLS_DIR).filter(n =>
            fs.statSync(path.join(SKILLS_DIR, n)).isDirectory()
          );
          // Live counts: All = non-router stubs; Picks = rank 1; Essentials = rank 1 + rank 2.
          let nonRouter = 0, picks = 0, essentials = 0;
          for (const name of dirs) {
            const stub = path.join(SKILLS_DIR, name, 'stub.yaml');
            if (!fs.existsSync(stub)) continue;
            const raw = fs.readFileSync(stub, 'utf8');
            if (/^type:\s*router/m.test(raw)) continue;
            nonRouter++;
            const rank = Number((raw.match(/^rank:\s*(\d+)/m) || [])[1]);
            if (rank === 1) { picks++; essentials++; }
            else if (rank === 2) { essentials++; }
          }
          const readme = fs.readFileSync('README.md', 'utf8');
          const fails = [];
          // Total — README.md line 4 "N skills covering"
          const totalM = readme.match(/^(\d+) skills covering/m);
          if (!totalM) fails.push('Cannot find "N skills covering" in README.md');
          else if (Number(totalM[1]) !== nonRouter)
            fails.push(`Total: README says ${totalM[1]}, actual non-router stubs = ${nonRouter}`);
          // Profile table — "| **Picks** … | `--picks` | N |" and the same for --essentials
          const profile = (flag, expected, label) => {
            const m = readme.match(new RegExp('`--' + flag + '`\\s*\\|\\s*~?(\\d+)'));
            if (!m) fails.push(`Cannot find the ${label} profile row (\`--${flag}\`) in README.md`);
            else if (Number(m[1]) !== expected)
              fails.push(`${label}: README says ${m[1]}, actual rank-based count = ${expected}`);
          };
          profile('picks', picks, 'Picks');
          profile('essentials', essentials, 'Essentials');
          if (fails.length) {
            console.error('README count drift:\n  ' + fails.join('\n  '));
            process.exit(1);
          }
          console.log(`OK — README counts match: All=${nonRouter}, Picks=${picks}, Essentials=${essentials}`);
          EOF

      - name: Check upstreams of changed skills are alive (PR only)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}   # authenticated → 5000 req/hr, no rate-limit false-negatives
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'skills/*/stub.yaml' 'skills/*/SKILL.md' \
            | sed -E 's#^skills/([^/]+)/.*#\1#' | sort -u | paste -sd, -)
          if [ -z "$CHANGED" ]; then
            echo "No skill stubs changed in this PR — skipping upstream freshness check."
            exit 0
          fi
          echo "Changed skills: $CHANGED"
          node scripts/check-upstreams.mjs --only "$CHANGED"
